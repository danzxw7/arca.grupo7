  <body>
   <!-- CONTEÚDO -->
    <main class="content">
    
         <section class="container">

        <!-- TÍTULO -->
        <div class="topo">

            <h1>Formulário de Adoção</h1>

            <h2 id="animal-escolhido">
                Animal: 
            </h2>

        </div>

        <!-- FORMULÁRIO -->
        <form id="form-adocao">

            <div class="grupo-input">

                <label>Nome Completo</label>

                <input 
                type="text"
                placeholder="Digite seu nome"
                required
                >

            </div>

            <div class="grupo-input">

                <label>Email</label>

                <input 
                type="email"
                placeholder="Digite seu email"
                required
                >

            </div>

            <div class="grupo-input">

                <label>Telefone</label>

                <input 
                type="tel"
                placeholder="Digite seu telefone"
                required
                >

            </div>

            <div class="grupo-input">

                <label>Idade</label>

                <input 
                type="number"
                placeholder="Sua idade"
                required
                >

            </div>

            <div class="grupo-input">

                <label>Endereço</label>

                <input 
                type="text"
                placeholder="Digite seu endereço"
                required
                >

            </div>

            <div class="grupo-input">

                <label>Possui outros animais?</label>

                <select required>

                    <option value="">
                        Selecione
                    </option>

                    <option>
                        Sim
                    </option>

                    <option>
                        Não
                    </option>

                </select>

            </div>

            <div class="grupo-input">

                <label>Por que deseja adotar?</label>

                <textarea 
                placeholder="Escreva aqui..."
                required
                ></textarea>

            </div>

            <!-- BOTÃO -->
            <div class="area-botao">

                <button type="submit" class="btn-adotar">
                    Adotar
                </button>

            </div>

        </form>

    </section>
