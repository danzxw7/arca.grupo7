    <!-- CSS -->

    <link rel="stylesheet" href="../css/areapet.css">

    <title>Área Pet</title>
</head>

<body>

    <!-- Botão hamburguer -->
    <button class="btn btn-dark menu-btn" onclick="toggleMenu()">
        ☰
    </button>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">

        <ul class="nav flex-column">

            <li class="nav-item">
                <a class="nav-link active" href="index.html">
                    🏠 Início
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="pages/adocao.html">
                    🐶 Adoção
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="pages/consulta.html">
                    📋 Consulta
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="pages/denuncias.html">
                    🚨 Denúncias
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="pages/areapet.html">
                    🐾 Área Pet
                </a>

            <li class="nav-item">
                <a class="nav-link" href="pages/sobrenos.html">

            <li class="nav-item">

                    👤 Meu Perfil
                </a>
            </li>

        </ul>

    </div>

    <!-- CONTEÚDO -->
    <main class="content">

        <section class="registro-pet-container">

            <h1>Registre seu Pet</h1>

            <div class="foto-pet">
                <span>🐾</span>
            </div>

            <form class="form-pet">

                <div class="grupo-inputs">

                    <div class="coluna">
                        <input type="text" id="nomePet" placeholder="Nome do Pet">

                        <input type="text" id="nomeTutor" placeholder="Nome do Tutor">
                    </div>

                    <div class="coluna">
                        <input type="text" id="racaPet" placeholder="Raça do Pet">

                        <input type="text" id="sexoPet" placeholder="Sexo do Pet">
                    </div>

                </div>

                <textarea id="infoAdicionais"
                    placeholder="Informações Adicionais"></textarea>

                <button type="submit" class="btn-confirmar">
                    Confirmar
                </button>

            </form>

        </section>

    </main>

    <!-- JS -->
    <script src="../js/script.js"></script>
    <script src="../js/areapet.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
